name: tennis-the-game

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tennis
      POSTGRES_PASSWORD: tennis
      POSTGRES_DB: tennis
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tennis -d tennis']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://tennis:tennis@db:5432/tennis?schema=public
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      VERIFY_WORKERS: 2
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
    ports:
      - '8080:80'
    depends_on:
      - api

volumes:
  pgdata:
